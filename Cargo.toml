[package]
name = "gameboy"
version = "0.1.5"
description = "Gameboy emulator written in Rust and WebAssembly"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
repository = "https://github.com/raphamorim/gameboy"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "gameboy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["libc", "glutin", "glutin-winit", "winit", "raw-window-handle", "gl", "ratatui", "icy_sixel", "image", "ratatui-image"]
ffi = []
ffi-base64 = ["image", "base64"]

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
debug = 0
panic = 'abort'
codegen-units = 1
incremental = false

[profile.dev]
split-debuginfo = "unpacked"
lto = false
incremental = true
opt-level = 0

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "0.2.191", optional = true }
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
winit = { version = "0.30.13", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
gl = { version = "0.14.0", optional = true }
ratatui = { version = "0.30.2", features = ["crossterm"], optional = true }
icy_sixel = { version = "0.5.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"], optional = true }
base64 = { version = "0.23.1", optional = true }
blip_buf = "0.2.1"
cpal = "0.18.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
console_error_panic_hook = "0.1.7"
web-sys = {version = "0.3.106", features = [
  'Document',
  'Element',
  'HtmlCanvasElement',
  'CanvasRenderingContext2d',
  'ImageData',
  'Window',
  'KeyboardEvent',
]}

#'WebGlBuffer',
#'WebGlRenderingContext',
#'ImageBitmap',
#'WebGlProgram',
#'WebGlShader',

[[example]]
name = "desktop"
path = "examples/desktop/bin.rs"

[[example]]
name = "terminal"
path = "examples/terminal/bin.rs"
